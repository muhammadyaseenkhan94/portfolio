" xml:space="preserve">  p_message  <tspan fill="#0033B3" font-weight="bold">OUT</tspan> <tspan fill="#0033B3" font-weight="bold">VARCHAR2</tspan></text><text x="198" y="156.5" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">6</text><text x="210" y="156.5" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">) <tspan fill="#0033B3" font-weight="bold">IS</tspan></text><text x="198" y="166.4" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">7</text><text x="210" y="166.4" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  l_on_hand <tspan fill="#0033B3" font-weight="bold">NUMBER</tspan>;</text><text x="198" y="176.3" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">8</text><text x="210" y="176.3" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve"><tspan fill="#0033B3" font-weight="bold">BEGIN</tspan></text><text x="198" y="186.2" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">9</text><text x="210" y="186.2" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  <tspan fill="#0033B3" font-weight="bold">SELECT</tspan> qty_on_hand <tspan fill="#0033B3" font-weight="bold">INTO</tspan> l_on_hand</text><text x="198" y="196.1" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">10</text><text x="210" y="196.1" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">    <tspan fill="#0033B3" font-weight="bold">FROM</tspan> stock <tspan fill="#0033B3" font-weight="bold">WHERE</tspan> item_id = p_item_id <tspan fill="#0033B3" font-weight="bold">AND</tspan> store_id = p_store_id</text><text x="198" y="206.0" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">11</text><text x="210" y="206.0" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">     <tspan fill="#0033B3" font-weight="bold">FOR</tspan> <tspan fill="#0033B3" font-weight="bold">UPDATE</tspan>;</text><text x="198" y="216.0" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">12</text><text x="210" y="216.0" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  <tspan fill="#0033B3" font-weight="bold">IF</tspan> l_on_hand &lt; p_qty <tspan fill="#0033B3" font-weight="bold">THEN</tspan></text><text x="198" y="225.9" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">13</text><text x="210" y="225.9" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">    p_message := <tspan fill="#067D17">'Insufficient stock: '</tspan> || l_on_hand || <tspan fill="#067D17">' available'</tspan>;</text><text x="198" y="235.8" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">14</text><text x="210" y="235.8" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">    <tspan fill="#0033B3" font-weight="bold">RETURN</tspan>;</text><text x="198" y="245.7" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">15</text><text x="210" y="245.7" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  <tspan fill="#0033B3" font-weight="bold">END</tspan> <tspan fill="#0033B3" font-weight="bold">IF</tspan>;</text><text x="198" y="255.6" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">16</text><text x="210" y="255.6" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  <tspan fill="#0033B3" font-weight="bold">UPDATE</tspan> stock <tspan fill="#0033B3" font-weight="bold">SET</tspan> qty_on_hand = qty_on_hand - p_qty</text><text x="198" y="265.5" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">17</text><text x="210" y="265.5" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">   <tspan fill="#0033B3" font-weight="bold">WHERE</tspan> item_id = p_item_id <tspan fill="#0033B3" font-weight="bold">AND</tspan> store_id = p_store_id;</text><text x="198" y="275.4" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">18</text><text x="210" y="275.4" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  p_message := <tspan fill="#067D17">'Issued '</tspan> || p_qty || <tspan fill="#067D17">' units'</tspan>;</text><text x="198" y="285.3" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">19</text><text x="210" y="285.3" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve"><tspan fill="#0033B3" font-weight="bold">EXCEPTION</tspan></text><text x="198" y="295.2" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">20</text><text x="210" y="295.2" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve">  <tspan fill="#0033B3" font-weight="bold">WHEN</tspan> NO_DATA_FOUND <tspan fill="#0033B3" font-weight="bold">THEN</tspan> p_message := <tspan fill="#067D17">'Item not found in store'</tspan>;</text><text x="198" y="305.1" font-family="Consolas,monospace" font-size="7.9" fill="#9CA3AF" text-anchor="end">21</text><text x="210" y="305.1" font-family="Consolas,monospace" font-size="7.9" fill="#1F2328" xml:space="preserve"><tspan fill="#0033B3" font-weight="bold">END</tspan> prc_issue_stock;</text><rect x="170" y="318" width="630" height="182" fill="#FFFFFF" stroke="#D8DDE4"/><rect x="170" y="318" width="630" height="20" fill="#E8ECF2"/><rect x="174" y="320" width="96" height="18" fill="#FFFFFF" stroke="#CBD2DC"/><text x="183" y="332" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#111827">Script Output</text><text x="283" y="332" font-family